<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <link rel="icon" href="src/assets/noteflowicon.svg" />
    <title>Note flow</title>
  </head>
  <body>
    <!-- Navigation Bar-->
    <nav id="navbar">
      <div id="brandNameLogo">
        <img id="brandLogo" src="src/assets/noteflowicon.svg" />
        <div id="brandName">
          <h1 id="gradientText">NOTE</h1>
          <p>flow</p>
        </div>
      </div>
      <img id="settingIcon" src="src/assets/settingicon.png" />
    </nav>
    <!-- Navigation Bar-->

    <!--Main-->
    <main id="noteCon">
      <div id="addNoteBtn">ADD NOTE</div>
    </main>
    <!--Main-->

    <!--Footer-->
    <footer id="bg-[#0E100E]">
      <p>© 2026 Noteflow by Jotham Den M. Baquiran</p>
    </footer>
    <!--Footer-->

    <!--ModalOverlay-->
    <div id="modalOverlay" class="hidden">
      <div id="modalBox">
        <h1 id="modalTitle">New Note</h1>
        <input type="text" id="noteTitleInput" placeholder="Title" />
        <textarea id="noteContentInput" placeholder="Content"></textarea>
        <div id="modalActions">
          <button id="modalCancelBtn">CANCEL</button>
          <button id="modalConfirmBtn">CONFIRM</button>
        </div>
      </div>
    </div>
    <!--ModalOverlay-->

    <script type="module" src="src/scripts/main.js"></script>
  </body>
</html>
